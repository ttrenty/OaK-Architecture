[workspace]
authors = []
channels = ["conda-forge"]
name = "OaK-Architecture"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.build_package]
cmd = "python -m build --no-isolation"
inputs = [
    "MANIFEST.in",
    "README.md",
    "pyproject.toml",
    "examples/**/*.py",
    "src/**/*.py",
]
outputs = ["dist/*"]

[tasks.test]
cmd = """
bash -lc '
python -m pip install -e . >/dev/null 2>&1 &&
find tst -type f -name "*.py" | sort | while read -r path; do
    echo "===== RUNNING: $path ====="
    python "$path" || exit 1
done
'
"""
# inputs = ["pixi.toml", "pyproject.toml", "examples/**/*.py", "src/**/*.py", "tst/**/*.py"]

[tasks.render_plantuml]
cmd = "mkdir -p docs/api/img && JAVA_TOOL_OPTIONS=-Djava.awt.headless=true plantuml -tsvg docs/diagrams/oak_core.puml docs/diagrams/oak_architecture.puml docs/diagrams/oak_runtime_overview.puml docs/diagrams/oak_runtime_sequence.puml && mv docs/diagrams/oak_core.svg docs/api/img/oak_core.svg && mv docs/diagrams/oak_architecture.svg docs/api/img/oak_architecture.svg && mv docs/diagrams/oak_runtime_overview.svg docs/api/img/oak_runtime_overview.svg && mv docs/diagrams/oak_runtime_sequence.svg docs/api/img/oak_runtime_sequence.svg"
inputs = ["docs/diagrams/**/*.puml"]
outputs = [
    "docs/api/img/oak_core.svg",
    "docs/api/img/oak_architecture.svg",
    "docs/api/img/oak_runtime_overview.svg",
    "docs/api/img/oak_runtime_sequence.svg",
]

[tasks.render_diagrams]
depends-on = ["render_plantuml"]

[tasks.docs]
cmd = "python docs/tools/generate_api_docs.py && echo 'API documentation available at docs/api/index.html'"
depends-on = ["render_diagrams"]
inputs = [
    "src/**/*.py",
    "docs/content/**/*.md",
    "docs/tools/generate_api_docs.py",
    "docs/tools/pdoc_templates/**/*.jinja2",
    "docs/tools/pdoc_templates/**/*.css",
    "docs/api/img/*.svg",
]
outputs = ["docs/api/**"]

[tasks.clean]
cmd = "rm -rf dist build docs/api *.egg-info"

[dependencies]
python = ">=3.14.3,<3.15"
setuptools = ">=80,<81"
openjdk = ">=25.0.2,<26"
graphviz = ">=14.1.2,<15"
plantuml = ">=1.2026.2,<2"
pip = ">=25.2,<26"

[pypi-dependencies]
build = ">=1.3.0,<2"
pdoc = ">=15.0.4,<16"
