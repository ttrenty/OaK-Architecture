[workspace]
authors = []
channels = ["conda-forge"]
name = "OaK-Architecture"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
smoke_interface = { depends-on = ["run_minimal_oak"] }
build_package = "python -m build --no-isolation"
test = "python -m pip install -e . && python tst/run_minimal_oak.py"
docs_api = "python tools/generate_api_docs.py"
render_mermaid = "mkdir -p docs/img && npx -y @mermaid-js/mermaid-cli -p docs/diagrams/puppeteer-config.json -i docs/diagrams/oak_core_marmaid.mmd -o docs/img/oak_core_marmaid.svg && npx -y @mermaid-js/mermaid-cli -p docs/diagrams/puppeteer-config.json -i docs/diagrams/oak_architecture_marmaid.mmd -o docs/img/oak_architecture_marmaid.svg"
render_plantuml = "JAVA_TOOL_OPTIONS=-Djava.awt.headless=true plantuml -tsvg docs/diagrams/oak_core.puml docs/diagrams/oak_architecture.puml docs/diagrams/oak_runtime_sequence.puml && mv docs/diagrams/*.svg docs/img/"
render_diagrams = { depends-on = ["render_mermaid", "render_plantuml"] }
# remove the building artefacts
clean = "rm -rf dist build *.egg-info"

[dependencies]
python = ">=3.14.3,<3.15"
setuptools = ">=80,<81"
openjdk = ">=25.0.2,<26"
graphviz = ">=14.1.2,<15"
nodejs = ">=25.7.0,<25.8"
plantuml = ">=1.2026.2,<2"
pip = ">=25.2,<26"

[pypi-dependencies]
build = ">=1.3.0,<2"
pdoc = ">=15.0.4,<16"
