[workspace]
channels = ["conda-forge"]
name = "OaK-Architecture"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks.build_package]
cmd = "python -m build --no-isolation"
inputs = [
    "MANIFEST.in",
    "README.md",
    "pyproject.toml",
    "examples/**/*.py",
    "src/**/*.py",
]
outputs = ["dist/*"]

[tasks._run_minimal_oak]
cmd = "env PYTHONPATH=src python -m tests.run_minimal_oak"

[tasks._run_minimal_oak_fine_grained]
cmd = "env PYTHONPATH=src python -m tests.run_minimal_oak_fine_grained"

[tasks._test_example_01_integration]
cmd = "env PYTHONPATH=src python -m tests.test_example_01_integration"

[tasks.tests_integration]
depends-on = ["_run_minimal_oak", "_run_minimal_oak_fine_grained", "_test_example_01_integration"]

[tasks.test_llm_connection]
cmd = "env PYTHONPATH=src OAK_RUN_LLM_CONNECTION_TEST=1 python -m tests.test_llm_connection"

[tasks.test_debug_example_01_cartpole]
cmd = "env PYTHONPATH=src python -m tests.debug_example_01_cartpole"

[tasks.test_example_01_cartpole]
cmd = "env PYTHONPATH=src python -m tests.run_example_01_cartpole"

[tasks.test_example_01_cartpole_described]
cmd = "env PYTHONPATH=src python -m tests.run_example_01_cartpole_described"

[tasks.tests]
depends-on = ["tests_fast", "test_llm_connection", "test_example_01_cartpole", "test_example_01_cartpole_described"]

# Use it with: `pixi run typecheck <path>`
[tasks.typecheck]
cmd = "mypy --ignore-missing-imports --show-error-codes src tests examples"

[tasks._render_plantuml]
cmd = "rm -f docs/diagrams/oak_core.svg docs/diagrams/oak_architecture.svg docs/diagrams/oak_runtime_overview.svg docs/diagrams/oak_runtime_sequence.svg docs/api/img/oak_core.svg docs/api/img/oak_architecture.svg docs/api/img/oak_runtime_overview.svg docs/api/img/oak_runtime_sequence.svg && mkdir -p docs/api/img && JAVA_TOOL_OPTIONS=-Djava.awt.headless=true plantuml -tsvg docs/diagrams/oak_core.puml docs/diagrams/oak_architecture.puml docs/diagrams/oak_runtime_overview.puml docs/diagrams/oak_runtime_sequence.puml && mv docs/diagrams/oak_core.svg docs/api/img/oak_core.svg && mv docs/diagrams/oak_architecture.svg docs/api/img/oak_architecture.svg && mv docs/diagrams/oak_runtime_overview.svg docs/api/img/oak_runtime_overview.svg && mv docs/diagrams/oak_runtime_sequence.svg docs/api/img/oak_runtime_sequence.svg"
inputs = ["docs/diagrams/**/*.puml"]
outputs = [
    "docs/api/img/oak_core.svg",
    "docs/api/img/oak_architecture.svg",
    "docs/api/img/oak_runtime_overview.svg",
    "docs/api/img/oak_runtime_sequence.svg",
]

[tasks.render_diagrams]
depends-on = ["_render_plantuml"]

[tasks.docs]
cmd = "python docs/tools/generate_api_docs.py && echo 'API documentation available at docs/api/index.html'"
depends-on = ["render_diagrams"]
inputs = [
    "src/**/*.py",
    "examples/**/*.py",
    "docs/content/**/*.md",
    "docs/tools/generate_api_docs.py",
    "docs/tools/pdoc_templates/**/*.jinja2",
    "docs/tools/pdoc_templates/**/*.css",
    "docs/api/img/*.svg",
]
outputs = ["docs/api/**"]

[tasks.export_conda_env]
cmd = "pixi workspace export conda-environment environment.yml && sed -i 's/^name: .*/name: OaK-Architecture/' environment.yml"
inputs = ["pixi.toml", "pixi.lock"]
outputs = ["environment.yml"]

[tasks.clean]
cmd = "rm -rf dist build docs/api src/*.egg-info src/oak/__pycache__ examples/__pycache__ docs/tools/__pycache__"

# shared dependencies
[dependencies]
python = ">=3.13,<3.14"
setuptools = ">=80,<81"
openjdk = ">=25.0.2,<26"
graphviz = ">=14.1.2,<15"
plantuml = ">=1.2026.2,<2"
pip = ">=25.2,<26"

[pypi-dependencies]
build = ">=1.3.0,<2"
pdoc = ">=15.0.4,<16"
gymnasium = ">=1.2.3,<2"
mypy = ">=1.15,<2"

# macOS feature: regular PyTorch from PyPI
[feature.macos]
platforms = ["osx-arm64"]

[feature.macos.pypi-dependencies]
torch = ">=2.10,<2.11"
torchvision = ">=0.25,<0.26"

# Linux GPU feature: CUDA wheel index + CUDA-specific torch
[feature.linux-gpu]
platforms = ["linux-64"]

[feature.linux-gpu.system-requirements]
cuda = "13.0"

[feature.linux-gpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]

[feature.linux-gpu.pypi-dependencies]
torch = "==2.10.0+cu130"
torchvision = "==0.25.0+cu130"

[environments]
macos = { features = ["macos"] }
linux-gpu = { features = ["linux-gpu"] }
