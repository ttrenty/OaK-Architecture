[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oakagent"
version = "0.1.0"
description = "Interfaces and reference wiring for a prototype OaK agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reinforcement-learning", "oak", "sutton", "interfaces", "benchmark", "artificial-intelligence", "agent-architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ttrenty/OaK-Architecture"
Documentation = "https://ttrenty.github.io/OaK-Architecture/"
Repository = "https://github.com/ttrenty/OaK-Architecture"
Issues = "https://github.com/ttrenty/OaK-Architecture/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pdoc>=15",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
